plugins {
	id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

loom {
	// M0 阶段先单 sourceset；客户端渲染代码落地后再开 common/client 分离。

	runs {
		client {
			// 实测发现：dev 客户端与 dev 服务端共用 run/ 时，客户端重新处理模组会撞上
			// 服务端已加载的 run/.fabric/processedMods/*.jar 文件锁（FileSystemException）。
			// 两者并行开发必须分开运行目录。
			runDir = "run-client"
		}
		// 第二个客户端（2026-11-21 加）：双客户端才测得了真 PvP、双队都有真人的对局、
		// 以及"双方各自死亡→复活"这类只有真玩家才走得通的链路。
		// 要点：
		//   · 必须独立 runDir —— 两个实例共用 run-client/ 会抢 logs/options.txt/saves；
		//   · 必须独立用户名 —— 同名会拿到同一个 UUID，服务端直接当成重复登录踢掉；
		//   · 用 --username 覆盖 Loom 默认的开发用户名（后出现的参数生效）。
		client2 {
			client()
			runDir = "run-client2"
			programArgs "--username", "Tester2"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Sable：M0 验证的核心依赖。用本地 jar（Modrinth CDN 14KB/s，不进构建缓存重复拉取）。
	// veil / forge-config-api-port / sable_rapier / sablecompanion 都 embedded 在 sable jar 的
	// fabric.mod.json "jars" 里，imguimc 为 optional，均不单独引入。
	//
	// 注意 dev 运行期必须走 run 目录的 mods/（见文件末尾 syncDevMods）：
	// Loom 重映射 libs 里的 mod jar 时会**丢掉 fabric.mod.json 的 "jars" 列表**
	// （实测 remapped jar 里 META-INF/jars/* 还在，但清单里已无引用），
	// Loader 于是看不到内嵌的 veil，runClient 直接报 "sable 需要 veil 但未安装"。
	// 所以这里只给编译期用；运行期的原始 jar（含 jars 清单）由 syncDevMods 放进 mods/。
	modCompileOnly files("libs/sable-fabric-1.21.1-2.0.6.jar")

	// sable-companion 只从 sable jar 的 META-INF/jars/ 里解出来这一份，**只给编译期用**：
	// Pose3dc / BoundingBox3ic / JOMLConversion 这些几何类型只存在于这个嵌套 jar，
	// 少了它任何碰 sub-level 位姿的代码都编译不过（M0 那个探针文件就是这么挂的）。
	// 它本身是个模组（带 fabric.mod.json），运行时由 sable 内嵌加载；
	// 若再放进 run/mods 或改成 implementation，会被重复注册。
	compileOnly files("libs/sable-companion-fabric-1.21.1-1.6.0.jar")

	// domain/cfg 层不依赖 Minecraft，用普通 JUnit 做回归（07 §6.1 第 1 层）
	compileOnly 'com.google.code.gson:gson:2.11.0'
	testImplementation 'com.google.code.gson:gson:2.11.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed", "skipped"
		exceptionFormat org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
	}
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// ---------------------------------------------------------------------------
// dev 运行目录的 mods/ 同步
// ---------------------------------------------------------------------------
// 运行期 Sable 必须从 mods/ 加载**原始 jar**：只有原始 jar 的 fabric.mod.json 还带 "jars"，
// Loader 才会展开内嵌的 veil / sable_rapier / sablecompanion / forge-config-api-port。
// （Loom 重映射后的 classpath jar 会丢掉 "jars"，见上面 dependencies 里的说明。）
def devModsDirs = [file("run-client/mods"), file("run-client2/mods"), file("run/mods")]
def sableDevJar = file("libs/sable-fabric-1.21.1-2.0.6.jar")

tasks.register("syncDevMods") {
	group = "fabric"
	description = "把 Sable 原始 jar 同步到 dev 运行目录的 mods/（保留内嵌 mod 声明）"
	inputs.file(sableDevJar)
	outputs.files(devModsDirs.collect { new File(it, sableDevJar.name) })
	doLast {
		devModsDirs.each { dir ->
			def dest = new File(dir, sableDevJar.name)
			if (!dest.exists() || dest.lastModified() < sableDevJar.lastModified()) {
				dir.mkdirs()
				java.nio.file.Files.copy(
					sableDevJar.toPath(), dest.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
				logger.lifecycle("[syncDevMods] ${dest}")
			}
		}
	}
}

tasks.matching { it.name in ["runClient", "runClient2", "runServer"] }.configureEach {
	dependsOn "syncDevMods"
}

