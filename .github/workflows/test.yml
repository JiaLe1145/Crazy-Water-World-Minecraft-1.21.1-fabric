name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # libs/ 被 .gitignore 排除（第三方 jar 不入库）。
      # 这里从 Modrinth 官方 CDN 下载 Sable 2.0.6，并从 jar 的 META-INF/jars/ 里解出 companion。
      - name: 下载 Sable 依赖
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fL --retry 3 --retry-delay 5 \
            -o libs/sable-fabric-1.21.1-2.0.6.jar \
            https://cdn.modrinth.com/data/T9PomCSv/versions/OLG7vDD6/sable-fabric-1.21.1-2.0.6.jar
          unzip -j -o libs/sable-fabric-1.21.1-2.0.6.jar \
            'META-INF/jars/sable-companion-fabric-1.21.1-1.6.0.jar' -d libs/
          ls -lh libs/

      - name: 单元测试
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: 汇总测试数
        if: always()
        run: |
          if [ ! -d build/test-results/test ]; then
            echo "没有测试报告目录"; exit 1
          fi
          python3 -c "import glob,xml.etree.ElementTree as ET,sys; rs=[ET.parse(p).getroot() for p in glob.glob('build/test-results/test/*.xml')]; t=sum(int(r.get('tests',0)) for r in rs); f=sum(int(r.get('failures',0)) for r in rs); e=sum(int(r.get('errors',0)) for r in rs); print(f'tests={t} failures={f} errors={e}'); sys.exit(1 if (f or e) else 0)"

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test
          if-no-files-found: warn
